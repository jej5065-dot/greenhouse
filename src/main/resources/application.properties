spring.application.name=greenhouse

# Default Port
server.port=8080

# Gemini AI Configuration
spring.ai.google.ai.api-key=${GEMINI-API-KEY:${GEMINI_API_KEY:}}
spring.ai.google.ai.chat.options.model=gemini-1.5-flash

# SQLite Configuration (Defaults to local, will override in deployment)
spring.datasource.url=jdbc:sqlite:greenhouse.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload Configuration
file.upload-dir=uploads
# Max file size 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
