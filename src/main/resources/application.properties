spring.application.name=greenhouse

# Default Port
server.port=8080

# Gemini AI Configuration
spring.ai.google.ai.api-key=${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
spring.ai.google.ai.chat.options.model=gemini-3-flash-preview

# SQLite Configuration (Defaults to local, will override in deployment)
# WAL (Write-Ahead Logging) is enabled for improved concurrency
spring.datasource.url=jdbc:sqlite:greenhouse.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# 'update' is used to ensure the schema is updated but doesn't modify/drop existing data columns
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload Configuration
file.upload-dir=uploads
# Max file size 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
