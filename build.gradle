plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.dined.dined'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.6.1.Final'
    implementation 'org.imgscalr:imgscalr-lib:4.2'
    implementation 'org.apache.commons:commons-csv:1.10.0'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 1. Build and bundle the frontend into the backend JAR
task buildFrontend(type: Exec) {
    workingDir 'frontend'
    // Use absolute path for npm found on system
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

task copyFrontend(type: Copy) {
    dependsOn buildFrontend
    from 'frontend/dist'
    into 'src/main/resources/static'
}

// Ensure frontend is built before the JAR is created
processResources.dependsOn copyFrontend

// 2. Deployment configuration
ext {
    remoteUser = 'jason'
    remoteHost = '192.168.68.94'
    jarName = 'greenhouse.jar'
    deployDir = '/opt/greenhouse'
}

task deployToRemote(type: Exec) {
    dependsOn bootJar
    def jarPath = "${buildDir}/libs/greenhouse-1.0-SNAPSHOT.jar"

    workingDir projectDir

    commandLine 'bash', '-c', """
        echo ">> Copying JAR to ${deployDir} on ${remoteHost}..."
        scp -o StrictHostKeyChecking=no "${jarPath}" ${remoteUser}@${remoteHost}:${deployDir}/${jarName}
        
        echo ">> Restarting Greenhouse service..."
        ssh -o StrictHostKeyChecking=no ${remoteUser}@${remoteHost} "sudo systemctl restart greenhouse"
        
        echo ">> Deployment Successful! App will be available on http://${remoteHost}:3000"
        echo ">> You can check logs with: ssh ${remoteUser}@${remoteHost} 'journalctl -u greenhouse -f'"
    """
}

test {
    useJUnitPlatform()
}